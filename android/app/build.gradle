apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Secrets — the Maps key and the release signing credentials.
 *
 * Both come from `android/local.properties`, which is gitignored, falling back
 * to the environment, which is how CI supplies them. See
 * `android/local.properties.example` for the full list of keys.
 *
 * **Nothing secret goes in `gradle.properties`.** That file is committed, so a
 * password put there is a password in the repo's history forever. Same reason
 * there is no fallback literal below: a key committed to the repo is a key that
 * has to be rotated.
 */
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

/** `local.properties` first, then the environment. `""` when neither has it. */
def secret = { String name ->
    (localProperties.getProperty(name) ?: System.getenv(name) ?: "").trim()
}

/**
 * A checkout without this still builds; it fails at runtime with "In-app
 * navigation isn't enabled for this app yet" — see `NavigationScreen`.
 */
def mapsApiKey = secret("MAPS_API_KEY")
if (!mapsApiKey) {
    logger.warn("MAPS_API_KEY is not set (android/local.properties or environment) — maps and in-app navigation will not authorise.")
}

/**
 * Release signing. All four are required together — a partial set is a
 * misconfiguration, not a reduced capability, so it is treated as absent.
 */
def releaseStoreFile = secret("MYAPP_UPLOAD_STORE_FILE")
def releaseStorePassword = secret("MYAPP_UPLOAD_STORE_PASSWORD")
def releaseKeyAlias = secret("MYAPP_UPLOAD_KEY_ALIAS")
def releaseKeyPassword = secret("MYAPP_UPLOAD_KEY_PASSWORD")
def releaseSigningReady =
    releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

/**
 * Resolved against the `android/` folder, **not** `android/app/`.
 *
 * `file(...)` in this script would resolve against the app module — which is
 * why the debug config's `file('debug.keystore')` finds `android/app/debug.keystore`.
 * The upload key sits beside `local.properties` at the `android/` level, so it
 * is resolved the same way that file is. An absolute path also works.
 */
def releaseKeystore = releaseStoreFile ? rootProject.file(releaseStoreFile) : null

if (releaseSigningReady && !releaseKeystore.exists()) {
    throw new GradleException(
        "MYAPP_UPLOAD_STORE_FILE points at ${releaseKeystore}, which does not exist. " +
        "The path is resolved relative to the android/ folder."
    )
}

/**
 * Without credentials the release build falls back to the debug key so that
 * `assembleRelease` still works for local testing — but the two tasks that
 * produce something uploadable stop outright rather than emitting an artifact
 * Play will reject at the end of a long upload.
 */
if (!releaseSigningReady) {
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.name == "bundleRelease" || it.name == "assembleRelease" }) {
            throw new GradleException(
                "Release signing is not configured. Set MYAPP_UPLOAD_STORE_FILE, " +
                "MYAPP_UPLOAD_STORE_PASSWORD, MYAPP_UPLOAD_KEY_ALIAS and " +
                "MYAPP_UPLOAD_KEY_PASSWORD in android/local.properties " +
                "(see android/local.properties.example) or in the environment."
            )
        }
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.xcentic.bhy"
    defaultConfig {
        applicationId "com.xcentic.bhy"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 11
        versionName "3.0.0"
        // Injected into AndroidManifest.xml as `com.google.android.geo.API_KEY`.
        manifestPlaceholders["MAPS_API_KEY"] = mapsApiKey

        /**
         * Ninja's own parallelism — which `org.gradle.workers.max` does **not**
         * control, contrary to the note in `gradle.properties`. That setting
         * caps Gradle's worker threads; the C++ step is a single Gradle task
         * that shells out to ninja, and ninja picks its own job count: cores + 2,
         * so 18 concurrent clang++ processes on this 16-core chip.
         *
         * Eighteen clang++ at a few hundred MB each is what exhausts a 7 GB box.
         * The symptom is not a compile error — it is a swarm of clang crash
         * dumps in %TEMP% plus bogus I/O errors ("unspecified system_category
         * error") on headers that are simply never reached, because CreateFile
         * starts failing for want of memory.
         *
         * Job pools are the only lever AGP forwards to ninja. Raise
         * `nativeBuildJobs` in `gradle.properties`, or on the command line, on a
         * machine with more RAM — it costs build time, not correctness.
         */
        externalNativeBuild {
            cmake {
                def nativeJobs = project.findProperty("nativeBuildJobs") ?: "2"
                arguments "-DCMAKE_JOB_POOL_COMPILE:STRING=compile",
                          "-DCMAKE_JOB_POOL_LINK:STRING=link",
                          "-DCMAKE_JOB_POOLS:STRING=compile=${nativeJobs};link=1"
            }
        }
    }

    compileOptions {
        // The Navigation SDK requires desugaring regardless of minSdkVersion.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            if (releaseSigningReady) {
                storeFile releaseKeystore
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Debug key only when nothing uploadable can be built anyway — the
            // task graph check above stops `bundleRelease`/`assembleRelease`.
            signingConfig releaseSigningReady ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Required by the Navigation SDK — see `coreLibraryDesugaringEnabled` above.
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs_nio:2.0.4")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// react-native-vector-icons: bundle the icon fonts into the APK.
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
