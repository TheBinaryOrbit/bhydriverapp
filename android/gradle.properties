# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
# 2g is not enough: `android.enableJetifier` below rewrites every dependency
# AAR in memory, and the Hermes/Firebase artifacts OOM the transform ("Java
# heap space" in JetifyTransform). 3g is the ceiling, not a target — on an 8GB
# machine a 4g heap makes the *daemon* die of native OOM instead, which is what
# the `hs_err_pid*.log` files in this folder are.
# 2 GB, not 3. This machine has ~7 GB usable, and the daemon is never the only
# thing wanting it: Metro, the editor and the C++ toolchain are all resident
# during a build. At -Xmx3072m the JVM died in `Chunk::new` — a *native* malloc
# failure, meaning the heap itself was fine and there was simply nothing left
# for the compiler threads to allocate. See android/hs_err_pid*.log.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# The C++ step is what actually exhausts the box. Ninja defaults to one job per
# core plus two — 18 concurrent clang++ processes on this 16-core chip, each
# worth a few hundred MB — and `buildCMakeDebug` is where the crashes landed.
# Capping Gradle's workers holds that down to something 7 GB can carry. Raise it
# if the machine ever gets more RAM; it costs build time, not correctness.
org.gradle.workers.max=2

# One JVM fewer to fight over RAM during the jetifier transforms above.
kotlin.compiler.execution.strategy=in-process

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Required by the Google Navigation SDK, which still ships support-library
# artifacts that have to be rewritten to AndroidX at build time.
android.enableJetifier=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
#
# Only the ABI you actually deploy to. AGP runs one full ninja C++ build per
# ABI, so listing all four quadruples build time for three .so files no device
# will ever load. arm64-v8a covers every physical phone made since ~2017.
#
# On an x86_64 emulator, override on the command line rather than editing this:
#     gradlew.bat app:installDebug -PreactNativeArchitectures=x86_64
#
# Release builds for the Play Store DO need the full list — pass it explicitly:
#     gradlew.bat app:bundleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
reactNativeArchitectures=arm64-v8a

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Use this property to enable edge-to-edge display support.
# This allows your app to draw behind system bars for an immersive UI.
# Note: Only works with ReactActivity and should not be used with custom Activity.
edgeToEdgeEnabled=false

